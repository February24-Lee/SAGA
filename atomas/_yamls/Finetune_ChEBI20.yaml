version: "Atomas-finetune-chebi20"

# data
dataset: "ChEBI-20_data"
train_split: "train"
valid_split: "validation"
test_split: "test"
batch_size: 4
eval_batch_size: 4
max_lenth: 512

# model
model_size: "base"
queue_size: 13200
task: "gentext"
tsclosswt: 1
lmlosswt: 10
wtilosswt: 1
encode_text_lr: 1e-4
encode_smiles_lr: 1e-4
molt5_lr: 1e-4
text_lr_scale: 0.1
smiles_lr_scale: 0.1
decay: 0

# CKA loss (enable with --include_mfp)
include_mfp: false
ckalosswt: 1.0
fp_type: "morgan"
mfp_queue_size: 1024

# Validation: skip retrieval (TtS/StT) to save time, monitor caption metric for ckpt
skip_retrieval: true

# train
precision: "bf16"
accumulate_grad_batches: 1
max_epochs: 100
start_valid_epoch: 0
check_val_every_n_epoch: 10

# warm-start from PubChemSTM-distill checkpoint (override via CLI)
init_from_checkpoint: ""
